    a { color: #e8c783; text-underline-offset: 4px; }
    .play { display: inline-block; padding: 11px 20px; border-radius: 8px; background: #e8c783; color: #171715; font-weight: 750; text-decoration: none; }
    a:focus-visible { outline: 2px solid #f7e6c1; outline-offset: 5px; }
