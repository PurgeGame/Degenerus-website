<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Craps table demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    .demo {
      display: flex;
      height: 100%;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      padding: 10px;
    }

    /* The table's own layouts are tuned to a tall, narrow phone or a wide desktop viewport, so it
       runs in an inner frame that is much taller than the felt and this stage crops to the card. */
    .stage {
      position: relative;
      flex: 0 0 auto;
      height: 330px;
      overflow: hidden;
      border-radius: 18px;
      background: #1a1a1a;
    }

    .stage iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 900px;
      max-width: none;
      border: 0;
      background: transparent;
    }

    .bar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .go {
      min-width: 9.5rem;
      min-height: 44px;
      padding: 0.55rem 1.4rem;
      border: 0;
      border-radius: 8px;
      background: #f5a623;
      color: #0d0d0d;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .go:hover:not(:disabled) { background: #ffb840; }
    .go:focus-visible, .sound:focus-visible { outline: 2px solid #f5a623; outline-offset: 2px; }
    .go:disabled { background: #3a2a0c; color: #a9843f; cursor: default; }

    .sound {
      min-height: 44px;
      padding: 0.4rem 0.9rem;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      background: #1a1a1a;
      color: #aaa;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .sound:hover { color: #f5a623; border-color: #f5a623; }
    .sound[aria-pressed="true"] { color: #f5a623; border-color: #f5a623; }

    .note {
      min-height: 2.6em;
      margin: 0;
      color: #aaa;
      font-size: 0.8rem;
      line-height: 1.3;
      text-align: center;
    }
    .note b { color: #e0e0e0; font-weight: 600; }
    @media (max-width: 600px) { .note { min-height: 3.9em; } }
    .note[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="demo">
    <div class="stage" data-bind="stage">
      <iframe data-bind="table" src="/learn/demos/craps-table.html" title="Craps table replaying a canned run"></iframe>
    </div>
    <div class="bar">
      <button type="button" class="go" data-bind="go" disabled>Watch a run</button>
      <button type="button" class="sound" data-bind="sound" aria-pressed="false">Sound off</button>
    </div>
    <p class="note" data-bind="note" aria-live="polite">Loading the recorded battle.</p>
  </main>
  <script src="/learn/demos/craps.js"></script>
</body>
</html>
