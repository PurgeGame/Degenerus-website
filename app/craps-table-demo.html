<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLIP Craps Table Demo</title>
  <link rel="stylesheet" href="/shared/nav.css">
  <link rel="stylesheet" href="/app/styles/base.css">
  <link rel="stylesheet" href="/app/styles/craps-table.css?v=point-puck-v20">
  <style>
    body.craps-demo-page { min-height: 100vh; margin: 0; background: #080b10; color: #f5ecd8; }
    .craps-demo { display: grid; min-height: 100vh; box-sizing: border-box; place-items: center; padding: 2rem; text-align: center; }
    .craps-demo__card { display: grid; max-width: 32rem; gap: 1rem; justify-items: center; }
    .craps-demo__card small { color: #b98a48; font-weight: 900; letter-spacing: 0.16em; }
    .craps-demo__card h1 { margin: 0; font-size: clamp(2rem, 8vw, 4rem); letter-spacing: 0.08em; }
    .craps-demo__card p { margin: 0; color: #929d98; line-height: 1.55; }
    .craps-demo__open { padding: 0.8rem 1.2rem; border: 1px solid #f1ca74; border-radius: 8px; background: linear-gradient(135deg, #f0c35f, #b9701e); color: #251501; font-weight: 950; cursor: pointer; }
    .craps-demo__receipt { min-height: 3rem; color: #86efac; font: 700 0.76rem/1.45 "Roboto Mono", ui-monospace, monospace; white-space: pre-line; }
  </style>
</head>
<body class="layout-basic craps-demo-page">
  <main class="craps-demo">
    <section class="craps-demo__card">
      <small>LOCAL INTERACTION DEMO</small>
      <h1>FLIP CRAPS</h1>
      <p>One shared table and one set of dice. Survival only flips when the reserve covers at least half, but less than all, of the next board. Add <code>?sim=1</code> to replay the sealed, sharded simulator fixture through the production data adapter.</p>
      <button type="button" class="craps-demo__open" data-bind="demo-open">OPEN TABLE</button>
      <output class="craps-demo__receipt" data-bind="demo-receipt" aria-live="polite"></output>
    </section>
  </main>
  <app-craps-table></app-craps-table>
  <script type="module" src="/app/craps-table-demo.js?v=point-puck-v20"></script>
</body>
</html>
