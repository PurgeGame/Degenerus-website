<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Unfinished quest pointing right</title>
  <defs>
    <linearGradient id="quest-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.48" stop-color="#f8bd3d"/>
      <stop offset="1" stop-color="#c96b12"/>
    </linearGradient>
    <radialGradient id="quest-core" cx="38%" cy="28%" r="72%">
      <stop offset="0" stop-color="#372044"/>
      <stop offset="1" stop-color="#110b18"/>
    </radialGradient>
  </defs>

  <!-- The Coinflip marker sits on the felt's left edge, so its tail leaves the
       bubble's right edge and points inward toward the game. The continuous
       outline mirrors the left marker without hiding any of the pointer. -->
  <g transform="translate(64 0) scale(-1 1)">
    <path fill="url(#quest-gold)" stroke="#05070b" stroke-width="3" stroke-linejoin="round"
          d="M38 4C24.7 4 15 13.5 15 27c0 1.5.1 3 .4 4.4L3 44l19.5.5C26.6 49.3 32 52 38 52c13.3 0 23-10.2 23-24S51.3 4 38 4Z"/>
    <path fill="url(#quest-core)" stroke="#fff0a3" stroke-width="1.4" stroke-linejoin="round"
          d="M38 10c-10 0-17 7.4-17 17.5 0 2 .3 4 .9 5.8L13 39.5h13C29 43.7 33 46 38 46c10.1 0 17-7.7 17-18S48.1 10 38 10Z"/>
    <path fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="5.4" d="M38 17.8v12"/>
    <circle cx="38" cy="39.2" r="3.1" fill="#ffffff"/>
  </g>
</svg>
