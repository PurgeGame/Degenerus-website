<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Unfinished quest pointing right</title>
  <defs>
    <linearGradient id="quest-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.48" stop-color="#f8bd3d"/>
      <stop offset="1" stop-color="#c96b12"/>
    </linearGradient>
    <radialGradient id="quest-core" cx="38%" cy="28%" r="72%">
      <stop offset="0" stop-color="#372044"/>
      <stop offset="1" stop-color="#110b18"/>
    </radialGradient>
  </defs>

  <!-- The Coinflip marker sits on the felt's left edge, so its tail leaves the
       bubble's right edge and points inward toward the game. -->
  <g transform="translate(64 0) scale(-1 1)">
    <path fill="#05070b" d="M20.5 18 1.9 28.8a3.7 3.7 0 0 0 0 6.4L20.5 46Z"/>
    <path fill="url(#quest-gold)" stroke="#2b1705" stroke-width="2.4" stroke-linejoin="round"
          d="M19.2 22.2 5.2 32l14 9.8Z"/>
    <path fill="#05070b" d="M35 1C18.4 1 7 12.1 7 27.8S18.4 55 35 55s28-11.5 28-27.2S51.6 1 35 1Z"/>
    <path fill="url(#quest-gold)" stroke="#2b1705" stroke-width="2.4"
          d="M35 5C20.8 5 11 14.2 11 27.7S20.8 51 35 51s24-9.8 24-23.3S49.2 5 35 5Z"/>
    <circle cx="35" cy="27.5" r="18.2" fill="url(#quest-core)" stroke="#fff0a3" stroke-width="2.2"/>
    <path fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="5.4" d="M35 17.8v12"/>
    <circle cx="35" cy="39.2" r="3.1" fill="#ffffff"/>
    <path fill="none" stroke="#fff8d5" stroke-linecap="round" stroke-width="2" opacity=".62"
          d="M19.5 17.2c3.5-4.1 8.7-6.3 14-6.5"/>
  </g>
</svg>
