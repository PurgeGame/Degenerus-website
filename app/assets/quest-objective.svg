<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Unfinished quest</title>
  <defs>
    <linearGradient id="quest-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.48" stop-color="#f8bd3d"/>
      <stop offset="1" stop-color="#c96b12"/>
    </linearGradient>
    <radialGradient id="quest-core" cx="38%" cy="28%" r="72%">
      <stop offset="0" stop-color="#372044"/>
      <stop offset="1" stop-color="#110b18"/>
    </radialGradient>
  </defs>

  <!-- A waypoint/speech-bubble silhouette makes "quest here" readable even
       at control-badge size; the centered tail points at the relevant action. -->
  <path fill="url(#quest-gold)" stroke="#05070b" stroke-width="3" stroke-linejoin="round"
        d="M32 3C16.5 3 5 12.5 5 27c0 11.5 7.5 19.7 18.5 22.8L32 62l8.5-12.2C51.5 46.7 59 38.5 59 27 59 12.5 47.5 3 32 3Z"/>
  <path fill="url(#quest-core)" stroke="#fff0a3" stroke-width="1.4" stroke-linejoin="round"
        d="M32 9c-12 0-21 7-21 18 0 8.9 5.8 15.2 16.5 17.4L32 51l4.5-6.6C47.2 42.2 53 35.9 53 27 53 16 44 9 32 9Z"/>
  <!-- The bubble is deliberately larger in the UI while the punctuation stays
       compact. The extra stem-to-dot air keeps the mark legible at badge size. -->
  <path fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="5.4" d="M32 17.8v12"/>
  <circle cx="32" cy="39.2" r="3.1" fill="#ffffff"/>
</svg>
