<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Decimator draw wheel">
  <defs>
    <linearGradient id="dec-rim" x1="8" y1="7" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".2" stop-color="#737b86"/>
      <stop offset=".42" stop-color="#eef2f5"/>
      <stop offset=".64" stop-color="#4a0a13"/>
      <stop offset=".82" stop-color="#e4e8eb"/>
      <stop offset="1" stop-color="#8d0b19"/>
    </linearGradient>
    <linearGradient id="dec-red" x1="17" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff5968"/>
      <stop offset=".48" stop-color="#e10e28"/>
      <stop offset="1" stop-color="#670916"/>
    </linearGradient>
    <linearGradient id="dec-gold" x1="26" y1="7" x2="38" y2="23" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff2a6"/>
      <stop offset=".45" stop-color="#ffbd36"/>
      <stop offset="1" stop-color="#a95708"/>
    </linearGradient>
    <linearGradient id="dec-green" x1="27" y1="7" x2="38" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d7ffe8"/>
      <stop offset=".42" stop-color="#35e787"/>
      <stop offset="1" stop-color="#087843"/>
    </linearGradient>
    <linearGradient id="dec-mint" x1="27" y1="8" x2="37" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eafff8"/>
      <stop offset=".5" stop-color="#aaffdf"/>
      <stop offset="1" stop-color="#299f82"/>
    </linearGradient>
    <radialGradient id="dec-hub" cx="38%" cy="28%" r="75%">
      <stop stop-color="#4c151d"/>
      <stop offset=".48" stop-color="#16080d"/>
      <stop offset="1" stop-color="#030406"/>
    </radialGradient>
    <filter id="dec-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="29" fill="#07080d" stroke="url(#dec-rim)" stroke-width="3"/>
  <circle cx="32" cy="32" r="24.25" fill="none" stroke="#31070e" stroke-width="9"/>
  <circle cx="32" cy="32" r="22.25" fill="none" stroke="url(#dec-red)" stroke-width="7"
          stroke-dasharray="9.45 4.53" stroke-linecap="butt" transform="rotate(-90 32 32)"/>
  <circle cx="32" cy="32" r="22.25" fill="none" stroke="url(#dec-green)" stroke-width="7.6"
          stroke-dasharray="9.45 130.35" stroke-linecap="butt" transform="rotate(90 32 32)"
          filter="url(#dec-glow)"/>
  <circle cx="32" cy="32" r="17" fill="url(#dec-hub)" stroke="#8a101e" stroke-width="1.25"/>

  <g filter="url(#dec-glow)">
    <path d="M32 4.8 25.8 17l6.2-2.7 6.2 2.7L32 4.8Z" fill="url(#dec-gold)" stroke="#fff0b3" stroke-width=".7"/>
    <path d="M30.7 32.5 31 13.7 32 9.2l1 4.5.3 18.8Z" fill="url(#dec-mint)"/>
  </g>

  <circle cx="32" cy="32" r="8.4" fill="#08090d" stroke="url(#dec-rim)" stroke-width="1.8"/>
  <path d="M31.8 39.6c-3.8-2.1-5.1-4.8-3.9-7.6.8-1.8 2.5-3.2 2.9-5.5 2.4 2.1 2.1 4.1 3.6 5.3.8-1.5.5-3 .9-4.5 2.7 3.2 3.5 6.3 2 8.7-1 1.6-2.7 2.7-5.5 3.6Z"
        fill="url(#dec-gold)" filter="url(#dec-glow)"/>
  <circle cx="32" cy="32" r="2.15" fill="#fff4c5" stroke="#7b0a17" stroke-width=".8"/>
