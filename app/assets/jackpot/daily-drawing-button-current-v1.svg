<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" preserveAspectRatio="none">
  <!-- Ticket-processing current. Both source-first lanes leave the single
       bottom-right VRF module and terminate beneath the physical jackpot key.
       The main processor route lives on the spin-only current sheet. -->
  <defs>
    <filter id="currentGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="1.35" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fromVrf" gradientUnits="userSpaceOnUse" x1="994" y1="0" x2="930" y2="0">
      <stop stop-color="#f8fdff"/>
      <stop offset="0.3" stop-color="#83adff"/>
      <stop offset="1" stop-color="#f4cb59"/>
    </linearGradient>
  </defs>
  <style>
    .current { stroke-dasharray: 12 30; animation: current-flow 1.45s linear infinite; }
    @keyframes current-flow { to { stroke-dashoffset: -42; } }
    @media (prefers-reduced-motion: reduce) {
      .current { stroke-dasharray: none; animation: none; opacity: .5; }
    }
  </style>
  <g class="current" fill="none" stroke="url(#fromVrf)" stroke-opacity="0.5"
     stroke-width="1.65" stroke-linecap="square" stroke-linejoin="miter"
     filter="url(#currentGlow)" vector-effect="non-scaling-stroke">
    <path d="M994 1116H930"/>
    <path d="M994 1158H930"/>
  </g>
</svg>
