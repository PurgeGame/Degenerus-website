<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" preserveAspectRatio="none">
  <!-- Spin-only current. The single bottom-right VRF module is the source and
       this sheet carries its output into the main draw processor. Ticket
       processing swaps to daily-drawing-button-current-v1.svg, whose shorter
       net terminates at the LED key instead. Keeping the two destinations on
       separate sheets makes the active load unambiguous. Geometry is copied
       from daily-drawing-board-routing-v6.svg, source first, so the negative
       dash offset always travels away from the module. -->
  <defs>
    <filter id="currentGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="fromVrf" gradientUnits="userSpaceOnUse" cx="1030" cy="1132" r="620">
      <stop stop-color="#a5cbff"/>
      <stop offset="0.2" stop-color="#5f93ff"/>
      <stop offset="0.55" stop-color="#73e8b0"/>
      <stop offset="1" stop-color="#e4b54e"/>
    </radialGradient>
  </defs>
  <style>
    .current { stroke-dasharray: 16 46; animation: current-flow 2.2s linear infinite; }
    @keyframes current-flow { to { stroke-dashoffset: -62; } }
    @media (prefers-reduced-motion: reduce) {
      .current { stroke-dasharray: none; animation: none; opacity: .42; }
    }
  </style>
  <!-- Bottom-right VRF module -> main draw processor. -->
  <g class="current" fill="none" stroke="url(#fromVrf)" stroke-opacity="0.6"
     stroke-width="3.1" stroke-linecap="square" stroke-linejoin="miter"
     filter="url(#currentGlow)" vector-effect="non-scaling-stroke">
    <path d="M1070 1116H1052L1030 1094V1028L1008 1006H920L898 984V915"/>
    <path d="M920 1006H672L654 988H640"/>
    <path d="M640 988V915"/>
  </g>
</svg>
