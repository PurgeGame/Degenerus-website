<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280" preserveAspectRatio="none">
  <!-- Jackpot-time current. The lit VRF module sends a compact pulse into the
       physical LED key first. Once that pulse lands, all four key outputs fan
       upward into the main jackpot processor together. Geometry is copied
       verbatim from daily-drawing-board-routing-v7.svg and authored source-first,
       so a negative dash offset always travels in the intended power direction. -->
  <defs>
    <filter id="currentGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="1.9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fromVrf" gradientUnits="userSpaceOnUse" x1="994" y1="0" x2="930" y2="0">
      <stop stop-color="#f8fdff"/>
      <stop offset="0.34" stop-color="#83adff"/>
      <stop offset="1" stop-color="#f4cb59"/>
    </linearGradient>
    <linearGradient id="fromKey" gradientUnits="userSpaceOnUse" x1="640" y1="1098" x2="640" y2="915">
      <stop stop-color="#f7ca58"/>
      <stop offset="0.32" stop-color="#75e6b0"/>
      <stop offset="0.7" stop-color="#69a6ff"/>
      <stop offset="1" stop-color="#f5fbff"/>
    </linearGradient>
  </defs>
  <style>
    .current--feed {
      stroke-dasharray: 11 24;
      animation: vrf-to-key 2.6s linear infinite;
    }
    .current--fanout {
      stroke-dasharray: 14 32;
      animation: key-to-jackpot 2.6s linear infinite;
    }
    @keyframes vrf-to-key {
      0% { stroke-dashoffset: 0; opacity: .08; }
      8% { stroke-dashoffset: 0; opacity: 1; }
      31% { stroke-dashoffset: -70; opacity: .9; }
      40%, 100% { stroke-dashoffset: -84; opacity: .06; }
    }
    @keyframes key-to-jackpot {
      0%, 28% { stroke-dashoffset: 0; opacity: .04; }
      38% { stroke-dashoffset: 0; opacity: .9; }
      88% { stroke-dashoffset: -92; opacity: .76; }
      100% { stroke-dashoffset: -112; opacity: .04; }
    }
    @media (prefers-reduced-motion: reduce) {
      .current--feed,
      .current--fanout { stroke-dasharray: none; animation: none; opacity: .44; }
    }
  </style>

  <!-- Beat one: the VRF module enters the physical key. -->
  <g class="current current--feed" fill="none" stroke="url(#fromVrf)" stroke-opacity="0.66"
     stroke-width="1.9" stroke-linecap="square" stroke-linejoin="miter"
     filter="url(#currentGlow)" vector-effect="non-scaling-stroke">
    <path d="M994 1116H930"/>
    <path d="M994 1158H930"/>
  </g>

  <!-- Beat two: the key distributes the pulse through every processor lane. -->
  <g class="current current--fanout" fill="none" stroke="url(#fromKey)" stroke-opacity="0.66"
     stroke-width="2.45" stroke-linecap="square" stroke-linejoin="miter"
     filter="url(#currentGlow)" vector-effect="non-scaling-stroke">
    <path d="M456 1098V1018L438 1000H432L414 982V915"/>
    <path d="M548 1098V1038L530 1020H524L506 1002V915"/>
    <path d="M732 1098V1038L750 1020H756L774 1002V915"/>
    <path d="M824 1098V1018L842 1000H848L866 982V915"/>
  </g>
</svg>
